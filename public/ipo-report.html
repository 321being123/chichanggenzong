<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>打新日报 · 报告详情</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="shared/style.css?v=__APP_VERSION__">
<link rel="stylesheet" href="css/ipo-report.css?v=__APP_VERSION__">
<link rel="preload" href="/vendor/marked.min.js?v=20260904" as="script">
<link rel="preload" href="/vendor/dompurify.min.js?v=3.4.17" as="script">
<script src="shared/autofill-guard.js?v=__APP_VERSION__"></script>
<script src="shared/ui-actions.js?v=__APP_VERSION__"></script>
<script defer src="vendor/marked.min.js?v=20260904"></script>
<script defer src="vendor/dompurify.min.js?v=3.4.17"></script>

<script src="shared/mobile-ui.js?v=__APP_VERSION__" defer></script>
<script src="shared/telemetry.js?v=__APP_VERSION__" defer></script>
</head>
<body>
  <div class="topbar">
    <button class="btn-back" data-act="ipoReportBack">← 返回</button>
    <img class="topbar-logo" src="/favicon.svg" alt="">
    <span class="title">打新日报</span>
    <span class="date" id="rpt-date"></span>
  </div>
  <div class="wrap">
    <div class="md" id="md-content"><div class="state">加载中…</div></div>
  </div>

<script>
function ipoReportBack() { document.referrer && new URL(document.referrer).origin === location.origin ? history.back() : location.assign("/?main=ipo"); }
  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function api(path) {
    // 与 app 同源，登录态 cookie 自动携带
    return path;
  }
  function reportUrl() {
    var date = getParam('date');
    var code = getParam('code');
    return code
      ? '/api/ipo/report/code?code=' + encodeURIComponent(code)
      : '/api/ipo/report' + (date ? ('?date=' + encodeURIComponent(date)) : '');
  }
  // 详情请求与 Markdown 渲染库并行发起，避免首次打开时串行等待。
  var reportRequest = fetch(api(reportUrl()), { credentials: 'same-origin' });
  // 安全输出状态/错误信息：用 textContent，绝不拼接进 innerHTML（防 XSS）
  // 自行获取容器元素，避免依赖外部作用域变量（修复 ReferenceError）
  function setState(msg, isErr) {
    var el = document.getElementById('md-content');
    if (!el) return;
    var div = document.createElement('div');
    div.className = 'state' + (isErr ? ' err' : '');
    div.textContent = msg;
    el.innerHTML = '';
    el.appendChild(div);
  }
  async function init() {
    var date = getParam('date');
    var code = getParam('code');
    var dateEl = document.getElementById('rpt-date');
    var content = document.getElementById('md-content');
    try {
      var r = await reportRequest;
      if (r.status === 401) {
        setState('未登录或登录已过期，请先在系统主页面登录后再打开本报告。', true);
        return;
      }
      if (r.status === 403) {
        setState('没有查看该报告的权限。', true);
        return;
      }
      if (r.status === 404) {
        setState('未找到' + (code ? ('代码 ' + code + ' 的') : (date ? ('日期 ' + date + ' 的') : '')) + '报告。', false);
        return;
      }
      if (r.status >= 500) {
        setState('服务器开小差了（' + r.status + '），请稍后重试。', true);
        return;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d;
      try {
        d = await r.json();
      } catch (e) {
        setState('返回的数据格式异常，无法解析。', true);
        return;
      }
      if (!d || !d.md) {
        setState('暂无' + (code ? '个股' : '') + '报告内容。', false);
        return;
      }
      if (code) {
        dateEl.textContent = '个股 ' + code;
      } else if (d.report_date) {
        dateEl.textContent = '报告日期 ' + d.report_date;
      }
      // Markdown 渲染结果经 DOMPurify 白名单净化后再写入，杜绝存储型 XSS
      if (content) content.innerHTML = DOMPurify.sanitize(marked.parse(d.md || ''), { USE_PROFILES: { html: true } });
      if (window.SiteTelemetry) window.SiteTelemetry.trackEvent('detail_open', { page_key: 'ipo.report', module: 'ipo', entry: 'report', properties: { detail_type: code ? 'stock_report' : 'daily_report' } });
    } catch (e) {
      setState('加载失败：' + (e.message || e), true);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
</script>
</body>
</html>
