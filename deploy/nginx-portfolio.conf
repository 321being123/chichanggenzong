# ===== 持仓管理系统 Nginx 反代配置 =====
# 用法：把本文件放到 /etc/nginx/conf.d/portfolio.conf（或 sites-enabled/）
# 然后 `nginx -t` 校验，`systemctl reload nginx` 生效
# 证书：腾讯云申请免费 SSL 后，将 fullchain.pem / privkey.pem 放到下面路径

limit_req_zone $binary_remote_addr zone=portfolio_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;

# HTTP 80 端口：强制跳转 HTTPS
server {
    listen 80;
    server_name cunzaitouzi.cn www.cunzaitouzi.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 443 端口：反代到本地 Node 服务（端口与 .env 的 PORT 一致）
server {
    listen 443 ssl;
    server_name cunzaitouzi.cn www.cunzaitouzi.cn;

    ssl_certificate     /etc/letsencrypt/live/cunzaitouzi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cunzaitouzi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HSTS：强制浏览器只用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn portfolio_conn 30;
    limit_conn_status 429;

    # ⚠️ 静态资源必须不限流：页面加载瞬间会并发请求 30+ 个带版本号的 JS/CSS，
    #    若放在 server 级限流会全部 429，导致 JS 加载失败、所有页面无数据（2026-08-01 事故）。
    location ~* [.](js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 动态接口：限流防刷（仅动态请求，不影响静态资源）
    location / {
        limit_req zone=portfolio_req burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;   # ← 与 PORT 一致
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;   # AI 识别最长约 60s，留足余量
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
