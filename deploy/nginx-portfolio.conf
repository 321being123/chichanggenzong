# ===== 持仓管理系统 Nginx 反代配置 =====
# 用法：把本文件放到 /etc/nginx/conf.d/portfolio.conf（或 sites-enabled/）
# 然后 `nginx -t` 校验，`systemctl reload nginx` 生效
# 证书：腾讯云申请免费 SSL 后，将 fullchain.pem / privkey.pem 放到下面路径

limit_req_zone $binary_remote_addr zone=portfolio_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;

log_format portfolio_timing '$time_iso8601 rid=$request_id "$request" status=$status '
    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
    'upstream_response_time=$upstream_response_time bytes=$bytes_sent '
    'gzip_ratio=$gzip_ratio protocol=$server_protocol ssl_protocol=$ssl_protocol '
    'ssl_session_reused=$ssl_session_reused';
access_log /var/log/nginx/portfolio_access.log portfolio_timing;

# 上游连接复用：静态资源与接口共用 Node 进程，避免 51 个资源请求反复建连。
upstream portfolio_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Ubuntu 生产主配置已在 http 上下文开启 gzip；这里补充压缩参数，避免重复声明 gzip on。
# gzip_proxied 对 proxy_pass 响应显式生效。
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_proxied any;
gzip_types application/json application/javascript text/javascript text/css application/xml image/svg+xml text/plain;

map $arg_v $portfolio_js_cache_control {
    ""      "public, max-age=604800";
    default "public, max-age=604800, immutable";
}

# HTTP 80 端口：强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cunzaitouzi.cn www.cunzaitouzi.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 443 端口：反代到本地 Node 服务（端口与 .env 的 PORT 一致）
server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    server_name cunzaitouzi.cn www.cunzaitouzi.cn;

    ssl_certificate     /etc/letsencrypt/live/cunzaitouzi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cunzaitouzi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS：强制浏览器只用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    # ⚠️ 静态资源必须不限流：页面加载瞬间会并发请求 30+ 个带版本号的 JS/CSS，
    #    若放在 server 级限流会全部 429，导致 JS 加载失败、所有页面无数据（2026-08-01 事故）。
    # 当前页面引用的 JS/CSS 均带 ?v= 版本参数，允许浏览器在版本不变时不再条件请求。
    location ~* [.](js|css)$ {
        expires off;
        # Node 的 express.static 默认会返回 max-age=0；隐藏上游头，避免与本处策略重复。
        proxy_hide_header Cache-Control;
        add_header Cache-Control $portfolio_js_cache_control always;
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* [.](png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 动态接口：限流防刷（仅动态请求，不影响静态资源）
    location / {
        limit_req zone=portfolio_req burst=100 nodelay;
        limit_req_status 429;
        limit_conn portfolio_conn 30;
        limit_conn_status 429;
        proxy_pass http://portfolio_node;   # ← 与 PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;   # AI 识别最长约 60s，留足余量
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
