<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资笔记 · 存在小站</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="shared/style.css?v=17">
<link rel="stylesheet" href="vendor/vditor/dist/index.css">
<link rel="stylesheet" href="css/knowledge.css?v=6">
<script src="shared/autofill-guard.js?v=3"></script>
<style>
  body { margin: 0; background: #f0f2f5; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; }
  .share-wrap { max-width: 820px; margin: 0 auto; padding: 32px 18px 60px; }
  .share-top { text-align: center; margin-bottom: 18px; }
  .share-top a { color: #1a237e; text-decoration: none; font-size: 14px; }
  .share-top h2 { margin: 8px 0 0; color: #1a1a2e; font-weight: 700; }
  .ks-meta { justify-content: center; }
  .ks-comment-form textarea { background: #fff; }
</style>
</head>
<body>
<div class="share-wrap">
  <div class="share-top">
    <a href="/">← 返回存在小站</a>
    <h2>📖 投资笔记</h2>
  </div>
  <div id="status" style="text-align:center;color:#b3a294;padding:40px 0;">正在加载文章…</div>
  <div id="article" class="hidden">
    <div class="ks-article">
      <h1 id="s-title"></h1>
      <div id="s-meta" class="ks-meta"></div>
      <div id="s-content" class="ks-content"></div>
    </div>
    <section class="ks-comments">
      <h3>💬 评论</h3>
      <div id="s-comment-list"></div>
      <div class="ks-comment-form" id="s-comment-form"></div>
    </section>
  </div>
</div>

<script src="vendor/vditor/dist/index.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/dompurify.min.js"></script>
<script src="shared/md-safe.js?v=2"></script>
<script src="shared/dialog.js?v=1"></script>
<script>
function api(path) { return path; }
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getToken() {
  return new URLSearchParams(location.search).get('token') || '';
}
// 写操作失败的统一友好提示（不回显服务器内部错误）
function writeErrMsg(status) {
  if (status === 401) return '请先登录后再操作';
  if (status === 403) return '你没有权限执行此操作';
  if (status === 404) return '内容不存在或已被删除';
  if (status === 413) return '内容过大，请精简后重试';
  return '操作失败，请稍后重试';
}
function hashIpPlaceholder() {}

async function loadArticle() {
  const token = getToken();
  if (!token) { document.getElementById('status').textContent = '缺少分享参数'; return; }
  try {
    const r = await fetch(api('/api/knowledge/share/' + encodeURIComponent(token)));
    if (!r.ok) { document.getElementById('status').textContent = '分享链接无效或文章未发布'; return; }
    const a = await r.json();
    aId = a.id;
    document.getElementById('status').classList.add('hidden');
    document.getElementById('article').classList.remove('hidden');
    document.getElementById('s-title').textContent = a.title || '无标题';
    const date = (a.published_at || a.updated_at || '').toString().slice(0, 19).replace('T', ' ');
    document.getElementById('s-meta').innerHTML =
      '<span>📁 ' + escapeHtml(a.category_name || '未分类') + '</span>' +
      '<span>👤 ' + escapeHtml(a.author_username || '') + '</span>' +
      '<span>🕒 ' + date + '</span><span>👁 ' + (a.view_count || 0) + '</span>';
    const content = document.getElementById('s-content');
    // 统一安全渲染：Vditor 优先，marked+DOMPurify 兜底净化
    renderMarkdownSafe(content, a.content || '');
    renderCommentForm(a.id);
    loadComments(a.id);
  } catch (e) {
    document.getElementById('status').textContent = '加载失败：' + (e.message || e);
  }
}

async function loadComments(id) {
  const box = document.getElementById('s-comment-list');
  try {
    const r = await fetch(api('/api/knowledge/articles/' + id + '/comments'));
    const list = await r.json();
    if (!list.length) { box.innerHTML = '<div class="ks-comment-empty">还没有评论，来抢沙发～</div>'; return; }
    box.innerHTML = renderComments(list, 0);
    // 绑定回复按钮
    box.querySelectorAll('.ks-reply-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const cid = btn.dataset.id;
        const exist = box.querySelector('.ks-reply-box[data-pid="' + cid + '"]');
        if (exist) { exist.remove(); return; }
        box.querySelectorAll('.ks-reply-box').forEach(function (b) { b.remove(); });
        const wrap = document.createElement('div');
        wrap.className = 'ks-reply-box';
        wrap.dataset.pid = cid;
        wrap.innerHTML = '<textarea class="ks-reply-text" placeholder="回复 @' + escapeHtml(btn.dataset.nick) + '…"></textarea>' +
          '<button class="ks-btn ks-btn-primary ks-reply-submit" data-pid="' + cid + '">回复</button>';
        btn.parentElement.appendChild(wrap);
        wrap.querySelector('.ks-reply-submit').addEventListener('click', function () {
          submitReply(aId, parseInt(cid, 10), wrap.querySelector('.ks-reply-text').value);
        });
      });
    });
  } catch (e) { box.innerHTML = ''; }
}

function renderComments(list, depth) {
  return list.map(function (c) {
    const t = (c.created_at || '').toString().slice(0, 19).replace('T', ' ');
    const nick = escapeHtml(c.nickname);
    return '<div class="ks-comment-item' + (depth > 0 ? ' ks-comment-child' : '') + '">' +
      '<div class="ks-comment-head"><b>' + nick + '</b><span>' + t + '</span></div>' +
      '<div class="ks-comment-body">' + escapeHtml(c.content) + '</div>' +
      '<button class="ks-reply-btn" data-id="' + c.id + '" data-nick="' + nick + '">回复</button>' +
      (c.replies && c.replies.length ? renderComments(c.replies, depth + 1) : '') +
      '</div>';
  }).join('');
}

let aId = null;

async function submitComment() {
  if (!aId) return;
  const text = document.getElementById('s-comment').value.trim();
  if (!text) { await projectAlert('评论内容不能为空'); return; }
  let r;
  try {
    r = await fetch(api('/api/knowledge/articles/' + aId + '/comments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text }),
    });
  } catch (e) { await projectAlert('网络异常，请检查后重试'); return; }
  if (!r.ok) {
    if (r.status === 400 || r.status === 429) { const d = await r.json().catch(function () { return {}; }); await projectAlert(d.error || writeErrMsg(r.status)); }
    else await projectAlert(writeErrMsg(r.status));
    return;
  }
  document.getElementById('s-comment').value = '';
  loadComments(aId);
}

function renderCommentForm(id) {
  const box = document.getElementById('s-comment-form');
  if (!box) return;
  aId = id;
  // 检查登录状态
  fetch(api('/api/me')).then(function (r) { return r.json(); }).then(function (u) {
    if (u && u.username) {
      box.innerHTML = '<textarea id="s-comment" placeholder="写下你的评论…"></textarea>' +
        '<button class="ks-btn ks-btn-primary" id="s-submit">发表评论</button>';
      document.getElementById('s-submit').addEventListener('click', submitComment);
    } else {
      box.innerHTML = '<div class="ks-comment-login-tip">💬 请 <a href="/login.html?redirect=' + encodeURIComponent('/share-knowledge.html?token=' + getToken()) + '">登录</a> 后发表评论</div>';
    }
  }).catch(function () {
    box.innerHTML = '<div class="ks-comment-login-tip">💬 请 <a href="/login.html?redirect=' + encodeURIComponent('/share-knowledge.html?token=' + getToken()) + '">登录</a> 后发表评论</div>';
  });
}

async function submitReply(id, parentId, text) {
  text = (text || '').trim();
  if (!text) { await projectAlert('评论内容不能为空'); return; }
  let r;
  try {
    r = await fetch(api('/api/knowledge/articles/' + id + '/comments'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, parent_id: parentId }),
    });
  } catch (e) { await projectAlert('网络异常，请检查后重试'); return; }
  if (!r.ok) {
    if (r.status === 400 || r.status === 429) { const d = await r.json().catch(function () { return {}; }); await projectAlert(d.error || writeErrMsg(r.status)); }
    else await projectAlert(writeErrMsg(r.status));
    return;
  }
  loadComments(id);
}

loadArticle();
</script>
</body>
</html>
