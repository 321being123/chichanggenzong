# ===== 持仓管理系统 Nginx 反代配置（HTTP · 公网IP临时版） =====
# 适用：域名还没下来，先用 http://服务器公网IP 访问。
# 用法：服务器上执行  cp deploy/nginx-portfolio-http.conf /etc/nginx/conf.d/portfolio.conf
#      然后  nginx -t && systemctl restart nginx
# 等域名申请下来、拿到 SSL 证书后，换成 deploy/nginx-portfolio.conf（HTTPS 版）即可。

limit_req_zone $binary_remote_addr zone=portfolio_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;

log_format portfolio_timing '$time_iso8601 rid=$request_id "$request" status=$status '
    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
    'upstream_response_time=$upstream_response_time bytes=$bytes_sent '
    'gzip_ratio=$gzip_ratio protocol=$server_protocol ssl_protocol=$ssl_protocol '
    'ssl_session_reused=$ssl_session_reused';
access_log /var/log/nginx/portfolio_access.log portfolio_timing;

upstream portfolio_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Ubuntu 生产主配置已在 http 上下文开启 gzip；这里补充压缩参数，避免重复声明 gzip on。
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_proxied any;
gzip_types application/json application/javascript text/javascript text/css application/xml image/svg+xml text/plain;

map $arg_v $portfolio_js_cache_control {
    ""      "public, max-age=604800";
    default "public, max-age=604800, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    # API 必须优先于后面的静态后缀正则，避免 /api/...foo.js 被当成公共静态资源缓存。
    location ^~ /api/ {
        limit_req zone=portfolio_req burst=100 nodelay;
        limit_req_status 429;
        limit_conn portfolio_conn 30;
        limit_conn_status 429;
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    # ⚠️ 静态资源必须不限流：页面加载瞬间会并发请求 30+ 个带版本号的 JS/CSS，
    #    若放在 server 级限流会全部 429，导致 JS 加载失败、所有页面无数据（2026-08-01 事故）。
    location ~* [.](js|css)$ {
        expires off;
        # Node 的 express.static 默认会返回 max-age=0；隐藏上游头，避免与本处策略重复。
        proxy_hide_header Cache-Control;
        add_header Cache-Control $portfolio_js_cache_control always;
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* [.](png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 动态接口：限流防刷（仅动态请求，不影响静态资源）
    location / {
        limit_req zone=portfolio_req burst=100 nodelay;
        limit_req_status 429;
        limit_conn portfolio_conn 30;
        limit_conn_status 429;
        proxy_pass http://portfolio_node;   # ← 与 .env 的 PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
